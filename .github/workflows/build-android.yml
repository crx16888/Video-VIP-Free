name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/VIP视频解析.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIP视频解析-Android
          path: android/app/build/outputs/apk/release/VIP视频解析.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: VIP视频解析 Android v1.0.0
          body: |
            安卓版 VIP 视频解析 App

            **安装方法：**
            1. 下载下方的 `VIP视频解析.apk` 文件
            2. 在手机上打开该文件
            3. 允许安装未知来源应用
            4. 安装完成后打开即可使用
          files: android/app/build/outputs/apk/release/VIP视频解析.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
